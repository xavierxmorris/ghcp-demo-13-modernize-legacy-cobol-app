name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Golden-master parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # `gnucobol` is a transitional package that pulls the 4.0 pre-release.
      # Pin 3.1.2 so the golden master stays reproducible. Both compile this
      # program to byte-identical behaviour, which CI re-proves on every run.
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version | head -1

      - name: Compile the legacy system
        run: npm run build:cobol

      - name: Legacy binary still matches its recorded golden master
        run: npm run parity:cobol -- --strict

      - name: Node.js port matches the specification
        run: npm run parity:node

      - name: Unit and integration tests
        run: npm test

      # Every failure here is a legacy defect the port fixed on purpose. The step
      # is informational: it prints the remediation manifest for the PR reviewer.
      - name: Remediation manifest
        if: always()
        run: node parity/cli.mjs verify --target node --policy bug-for-bug || true

  java-dotnet:
    name: Java and .NET contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Compile both ports, compare the shared scenarios, and check storage failures
        run: npm run test:ports

      - name: Install the original-reference compiler for the taxation evidence gate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnucobol3

      - name: Trace original COBOL evidence to both modern targets
        run: npm run tax:check

      - name: Upload original-source migration evidence
        uses: actions/upload-artifact@v7
        with:
          name: original-cobol-taxation-evidence
          path: build/tax-office/evidence-java-dotnet.json
          if-no-files-found: error
          retention-days: 7

  guard-recorded-artefacts:
    name: Recorded artefacts match the binary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The legacy sources are the specification. Changing them and the recorded
      # baselines together would be self-consistent and would otherwise pass, so
      # any .cob change is rejected here and must be an explicit, reviewed
      # decision rather than a side effect of turning a suite green.
      - name: The legacy COBOL sources must not change
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.cob')
          if [ -n "$changed" ]; then
            echo "::error::The .cob files are the specification and must not be modified:"
            echo "$changed"
            exit 1
          fi
          echo "Legacy sources unchanged."

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnucobol3

      - name: Compile the legacy system
        run: npm run build:cobol

      # If golden files or expectLegacy were edited by hand rather than recorded,
      # re-recording produces a diff. This is a reproducibility check - it proves
      # the committed evidence matches what the committed COBOL produces - not a
      # permission system.
      - name: Re-record and require an identical result
        run: |
          npm run parity:record
          if ! git diff --quiet -- spec/scenarios.json parity/golden; then
            echo "::error::Recorded artefacts do not match the COBOL binary."
            echo "spec/scenarios.json expectLegacy and parity/golden/ are recorded output."
            echo "Regenerate them with 'npm run parity:record' instead of editing them."
            git --no-pager diff -- spec/scenarios.json parity/golden
            exit 1
          fi
          untracked=$(git status --porcelain --untracked-files=all -- parity/golden)
          if [ -n "$untracked" ]; then
            echo "::error::Untracked or orphan files under parity/golden:"
            echo "$untracked"
            exit 1
          fi
          echo "Recorded artefacts match the binary."

      # Fails if a golden file named by the spec is missing, or if parity/golden
      # holds a file no scenario accounts for.
      - name: Golden file set matches the specification
        run: npm test -- --test-name-pattern='the golden file set matches the specification exactly'
