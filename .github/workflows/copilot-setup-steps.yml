name: "Copilot Setup Steps"

# Prepares the ephemeral environment Copilot cloud agent and Copilot code review
# work in. Without this, the agent has no COBOL compiler and cannot run the
# parity harness - it would be reduced to reasoning about the legacy system
# instead of executing it, which is exactly what this repository forbids.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Pinned to 3.1.2 to match CI. `gnucobol` is a transitional package that
      # installs the 4.0 pre-release.
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnucobol3
          cobc --version | head -1

      - name: Compile the legacy system
        run: npm run build:cobol

      - name: Verify the toolchain end to end
        run: npm test
